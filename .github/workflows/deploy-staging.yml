name: Deploy Frontend to Staging

on:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm run lint
      - name: Build (VITE_API_URL relatif - satu origin sama backend lewat nginx)
        run: echo "VITE_API_URL=/api" > .env.production.local && pnpm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-staging
          path: |
            build/
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-staging
          path: dist

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'dist/*'
          target: '~/apps/frontend-staging'
          strip_components: 1
          overwrite: true

      - name: Install runtime deps & restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/apps/frontend-staging
            pnpm install --prod
            pm2 restart cv-anugrah-frontend-staging
